settings:
  http_ok_codes: [200, 302, 401, 403]
  curl_timeout_seconds: 8
  ssh_connect_timeout_seconds: 8

  # StrongDM-safe refresh pacing (your request: 1 sec per JVM)
  ssh_max_parallel: 2
  refresh_delay_seconds: 1

  # Actions (keep small)
  action_max_parallel: 2

  # IMPORTANT: prevent STOP from hanging forever
  action_timeout_seconds: 90

  # Logging
  history_file: "history.jsonl"
  instance_output_max_entries: 60
  log_max_entries: 1000

  # Only actions use su -> ihtomcat
  run_as: "su"
  action_force_tty: true
  ihtomcat_home: "/home/ihtomcat"
  action_timeout_seconds: 90


  console_host: "127.0.0.1"
  console_port: 5000

